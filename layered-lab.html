<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>战士 · 分层换装工坊</title>
<style>
:root{color-scheme:dark;font-family:system-ui,'Microsoft YaHei',sans-serif;background:#10291f;color:#f2ecd2}*{box-sizing:border-box}body{margin:0}main{max-width:1600px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:25px;margin:4px 0}p{color:#b9c9ae;line-height:1.7;font-size:14px}a{color:#a4decb}header a{white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:20px}canvas{display:block;width:100%;border-radius:15px;border:1px solid #71835a;background:#8d9c73}.panel{padding:20px;background:#1b3c2c;border:1px solid #48694a;border-radius:15px}h2{font-size:16px;margin:0 0 17px}label{display:block;font-size:13px;color:#c4d0b5;margin:14px 0 7px}select,button{font:inherit;color:#fff1d5;background:#31523b;border:1px solid #789266;border-radius:7px;padding:9px;width:100%}button{cursor:pointer}select:focus,button:focus{outline:2px solid #a9ddcb}input[type=range]{width:100%;accent-color:#b6ce85}.row{display:flex;gap:8px}.row>*{min-width:0}.check{display:flex;align-items:center;gap:8px}.check input{accent-color:#b6ce85}.primary{display:block;text-align:center;background:#d1bd79;color:#173b2a;font-weight:700;padding:12px;border-radius:8px;text-decoration:none;margin-top:22px}.small{font-size:12px;color:#b0c0a5}.status{min-height:24px}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#bdd0af;margin:10px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#70ffdc}.dot.socket{background:#ffca61}.footer{font-size:12px;color:#97af92;margin-top:20px}.pill{color:#d9dca9;border:1px solid #71835a;border-radius:20px;padding:5px 12px;font-size:12px}@media(max-width:900px){main{padding:12px}.layout{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.panel h2,.panel .primary,.panel .small{grid-column:1/-1}h1{font-size:20px}}
</style></head><body><main>
<header><div><h1>战士 · 分层换装工坊</h1><p>保留原角色造型。独立部件、八方向、连续动作与实时换装。</p></div><a href="index.html">返回游戏 →</a></header>
<div class="layout"><section><canvas id="rig-canvas" width="1200" height="830" tabindex="0" aria-label="战士分层动画与八方向对照"></canvas><div class="legend"><span><i class="dot"></i>骨骼关节</span><span><i class="dot socket"></i>装备与特效挂点</span><span>点画布后：WASD 试走 · J 普攻 · Space 闪避</span></div><div class="row"><button id="pause">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><select id="speed" aria-label="播放速度"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div><label for="timeline">动作采样 <span id="frame">1 / 60</span></label><input id="timeline" type="range" min="0" max="59" value="0"><p id="status" class="status">正在加载独立分层素材…</p></section>
<aside class="panel"><h2>动作与装备 <span class="pill">战士样板</span></h2>
<div><label for="clip">动作</label><select id="clip"><option value="idle">待机</option><option value="run">向前走</option><option value="backstep">后退</option><option value="strafe">侧移</option><option value="attack">普攻</option><option value="run-attack">移动普攻</option><option value="bash">盾冲</option><option value="dodge">闪避</option><option value="hit">受击</option></select></div>
<div><label for="direction">对照方向</label><select id="direction"><option value="0">东</option><option value="1" selected>东南</option><option value="2">南</option><option value="3">西南</option><option value="4">西</option><option value="5">西北</option><option value="6">北</option><option value="7">东北</option></select></div>
<div><label for="weapon">主手</label><select id="weapon"><option value="sword">原色短剑</option><option value="axe">铁战斧</option><option value="none">卸下武器</option></select></div>
<div><label for="shield">副手</label><select id="shield"><option value="shield-kite">原色青盾</option><option value="shield-round">木圆盾</option><option value="none">卸下盾牌</option></select></div>
<div><label for="helmet">头部</label><select id="helmet"><option value="helmet-silver">原色银盔</option><option value="helmet-bronze">铜盔样件</option><option value="none">基础头部检视</option></select></div>
<div><label for="cape">披风</label><select id="cape"><option value="cape-red">原色红披风</option><option value="none">卸下披风</option></select></div>
<div><label class="check"><input id="debug" type="checkbox">显示骨骼与挂点</label><label for="explode">分层拆解</label><input id="explode" type="range" min="0" max="1" step=".01" value="0"></div>
<div><label>&nbsp;</label><button id="reset">恢复原色装备</button><button id="export" style="margin-top:8px">导出装配配置</button></div>
<a id="battle" class="primary" href="index.html?warriorRig=layered">试穿进入实际战斗 →</a><p class="small">试装只改变战士外观，不改变伤害、射程或职业。原版保留在左侧作造型对照。此次为 Canvas 分层样板，无需 Spine 授权。</p>
</aside></div><p class="footer">原始 PNG 独立部件 · 动作时钟与战斗判定分离 · 装备挂点固定于手部 · 60 格是采样检查，不是 60 张新绘帧</p>
</main><script type="module" src="src/coop/layered-lab.js"></script></body></html>
