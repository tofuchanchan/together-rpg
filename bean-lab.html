<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D 角色 · 八方向动作工坊</title><style>body{margin:0;background:#112b22;color:#e8eaca;font:15px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1350px;margin:auto;padding:28px}a{color:#6edbd0}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px}select,button{background:#2c4f39;color:#f8eccb;border:1px solid #719369;border-radius:8px;padding:10px 14px;font:inherit}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0}canvas{width:100%;background:#8c9e70;border-radius:18px}p{color:#b9ceb1}input{accent-color:#63d3c6}#timeline{width:280px}</style></head><body><main><header><h1>D 角色 · 八方向动作工坊</h1><a href="index.html">返回双人战斗 →</a></header><p>按照 D 示例图重绘的三职业 PNG 精灵，已用于实际战斗。查看八方向、步态和出招姿态。</p><nav><select id="role"><option value="warrior">战士</option><option value="mage">法师</option><option value="archer">弓手</option></select><select id="clip"><option value="idle">待机</option><option value="run">跑动</option><option value="attack">自动普攻</option><option value="run-attack">移动普攻</option><option value="skill1">主动技能 1</option><option value="skill2">主动技能 2</option><option value="dodge">闪避</option></select><button id="pause">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><select id="speed"><option value="1">1×</option><option value=".5">0.5×</option><option value=".25">0.25×</option></select><input type="range" id="timeline" min="0" max="59" value="0" aria-label="动作帧"><span id="frame"></span><button id="export">导出当前职业图集</button></nav><canvas id="sheet" width="1344" height="490"></canvas><p id="hint"></p><p><a href="lab.html">旧低多边形动画试验场</a> · 每职业 64 个绘制姿态：8 方向 ×（4 个移动姿态 + 4 个战斗姿态）。连续播放，时间轴为 60 等分预览；原画中的脚部与持武器手臂分别连续运动，移动攻击保留腿部步态；技能复用相应出招姿态，法术与弹道独立渲染。</p></main><script type="module" src="src/coop/lab.js"></script></body></html>
